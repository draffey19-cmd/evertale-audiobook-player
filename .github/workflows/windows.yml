name: Build EverTale for Windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [main, 'feature/local-ai-transcription-beta']
    paths:
      - 'app/**'
      - '.github/workflows/windows.yml'
concurrency:
  group: evertale-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript
        run: npm run check
      - name: Build Windows installer
        run: npm run build:win -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: EverTale-Windows-Installer
          path: app/dist/*.exe
          if-no-files-found: error
