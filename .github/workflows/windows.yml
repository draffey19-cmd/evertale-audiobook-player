name: Build EverTale for Windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [main, 'feature/local-ai-transcription-beta']
    paths:
      - 'app/**'
      - '.github/workflows/windows.yml'
concurrency:
  group: evertale-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript
        run: npm run check
      - name: Compile bundled Whisper engine
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git "$env:RUNNER_TEMP/whisper-source"
          cmake -S "$env:RUNNER_TEMP/whisper-source" -B "$env:RUNNER_TEMP/whisper-build" -DGGML_CUDA=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build "$env:RUNNER_TEMP/whisper-build" --config Release --target whisper-cli
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/whisper-build" -Recurse -File | Where-Object { $_.Name -in @('whisper-cli.exe','whisper.dll','ggml.dll','ggml-base.dll','ggml-cpu.dll') } | ForEach-Object { Copy-Item $_.FullName bin/ -Force }
          if (!(Test-Path bin/whisper-cli.exe)) { throw 'Missing Whisper CLI' }
      - name: Bundle official NVIDIA CUDA Whisper engine (Windows x64)
        if: github.ref == 'refs/heads/feature/local-ai-transcription-beta'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-win-cuda-11.8.0-x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'whisper-cuda.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'whisper-cuda'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'e81c86c542be6e3d7b7245392d4e1c52ab6e5c61dbe38721754bc0ab59d4d027'
          if ($actual -ne $expected) { throw "CUDA engine checksum mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $extract
          New-Item -ItemType Directory -Force ai-gpu | Out-Null
          $exe = Get-ChildItem $extract -Recurse -File -Filter 'whisper-cli.exe' | Select-Object -First 1
          if (!$exe) { throw 'Official CUDA archive does not contain whisper-cli.exe' }
          Copy-Item $exe.FullName 'ai-gpu/whisper-cli.exe' -Force
          Get-ChildItem $extract -Recurse -File -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName ai-gpu/ -Force }
          if (!(Test-Path 'ai-gpu/whisper-cli.exe')) { throw 'CUDA executable missing' }
          Write-Host "Bundled official CUDA 11.8 Whisper engine and $((Get-ChildItem ai-gpu -File).Count) runtime files"
      - name: Build Windows installer
        run: npm run build:win -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: EverTale-Windows-Installer
          path: app/dist/*.exe
          if-no-files-found: error
